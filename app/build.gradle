plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dbdm.modmenu'
    compileSdk 34

    defaultConfig {
        applicationId "com.dbdm.modmenu"
        minSdk 26
        targetSdk 33
        versionCode 10
        versionName "2.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

